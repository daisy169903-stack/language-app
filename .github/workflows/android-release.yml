name: Android release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Determine version and avoid replacing published releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'package.json must contain a stable major.minor.patch version.' >&2
            exit 1
          fi
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'The pushed tag must match package.json version.' >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2> "$RUNNER_TEMP/release-query-error"; then
            echo 'Release already exists; bump package.json version to publish another APK.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-query-error"; then
              echo 'Cannot verify whether the release exists; publication stopped.' >&2
              exit 1
            fi
            # A private repository with insufficient access may also return 404.
            gh api "repos/$GITHUB_REPOSITORY" --silent
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.publish == 'true'
        with:
          version: "11.25.0"
      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.publish == 'true'
      - name: Restore the existing app signing key
        if: steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Missing ANDROID_KEYSTORE_BASE64: upload the original .android-tools/debug.keystore as a repository Actions secret. A replacement key cannot update installed copies.' >&2
            exit 1
          fi
          umask 077
          mkdir -p .android-tools
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .android-tools/release.keystore
          test -s .android-tools/release.keystore
      - name: Install, verify and build
        if: steps.version.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm android:sync
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon assembleRelease)
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/VietLingo-HU-Android.apk
      - name: Publish APK as an immutable versioned release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/VietLingo-HU-Android.apk \
            --target "$GITHUB_SHA" --title "VietLingo HU $RELEASE_TAG" --generate-notes --latest
      - name: Remove temporary signing key
        if: always()
        run: rm -f .android-tools/release.keystore
